name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "ExpenseAPI/**"
      - "src/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular frontend
        run: npm run build -- --configuration production

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish API
        run: dotnet publish ExpenseAPI/ExpenseAPI.csproj --configuration Release --output "${{ runner.temp }}/expense-api"

      - name: Add Angular frontend to API package
        run: |
          mkdir -p "${{ runner.temp }}/expense-api/wwwroot"
          cp -R dist/demo/browser/. "${{ runner.temp }}/expense-api/wwwroot/"

      - name: Validate deployment settings
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || { echo "Repository variable AZURE_WEBAPP_NAME is missing."; exit 1; }
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || { echo "Repository secret AZURE_WEBAPP_PUBLISH_PROFILE is missing."; exit 1; }

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/expense-api
